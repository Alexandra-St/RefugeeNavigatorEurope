name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore RefugeeNavigatorEurope.slnx
      - name: Build
        run: dotnet build RefugeeNavigatorEurope.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test RefugeeNavigatorEurope.slnx --configuration Release --no-build
      - name: Test deployment verification script
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Build production Docker image
        run: docker build --file Dockerfile --tag refugee-navigator-europe:ci .
      - name: Run Docker integration smoke tests
        run: .github/scripts/docker-smoke-test.sh refugee-navigator-europe:ci
